<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 880 330" width="880" height="330"
  role="img" aria-label="Activity mix, last 12 months: commits 100%, pull requests 0%, code review 0%, issues 0%."
  font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <style>
      .ink { fill: #F2EFE8 } .dim { fill: #7E7B75 } .faint { fill: #413F3B }
      .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif }
      .rise { opacity: 0; animation: rise .8s cubic-bezier(.16,1,.3,1) forwards }
      @keyframes rise { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }
      .frame {
        fill: none; stroke: #2B2926; stroke-width: 1;
        stroke-dasharray: 2420; stroke-dashoffset: 2420;
        animation: draw 1.2s cubic-bezier(.16,1,.3,1) forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0 } }
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="328" rx="7" fill="url(#bg)" />
  <rect class="frame" x="1" y="1" width="878" height="328" rx="7" />

  <text class="serif faint rise" x="40" y="44" font-size="11" letter-spacing="3.2" style="animation-delay:.45s">A C T I V I T Y</text>
  <text class="dim rise" x="40" y="68" font-size="12.5" style="animation-delay:.5s">contribution mix · last 12 months</text>
  <line x1="40" y1="86" x2="840" y2="86" stroke="#2B2926" />
  <g class="rise" style="animation-delay:.85s">
    <circle cx="250" cy="200" r="78" fill="none" stroke="#2B2926" stroke-dasharray="2 4" />
    <line x1="250" y1="122" x2="250" y2="278" stroke="#413F3B" />
    <line x1="172" y1="200" x2="328" y2="200" stroke="#413F3B" />
    <polygon points="250.0,200.0 250.1,200.0 250.0,200.0 172.0,200.0" fill="#F2EFE8" fill-opacity="0.14" stroke="#F2EFE8" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="250.0" cy="200.0" r="3" fill="#F2EFE8" />
    <circle cx="250.1" cy="200.0" r="3" fill="#F2EFE8" />
    <circle cx="250.0" cy="200.0" r="3" fill="#F2EFE8" />
    <circle cx="172.0" cy="200.0" r="3" fill="#F2EFE8" />
    <text class="dim" x="250" y="98" font-size="12" text-anchor="middle">Code review</text>
    <text class="ink serif" x="250" y="115" font-size="15" text-anchor="middle">0%</text>
    <text class="dim" x="342" y="197" font-size="12">Issues</text>
    <text class="ink serif" x="342" y="216" font-size="15">0%</text>
    <text class="dim" x="250" y="300" font-size="12" text-anchor="middle">Pull requests</text>
    <text class="ink serif" x="250" y="318" font-size="15" text-anchor="middle">0%</text>
    <text class="dim" x="158" y="197" font-size="12" text-anchor="end">Commits</text>
    <text class="ink serif" x="158" y="216" font-size="15" text-anchor="end">100%</text>
  </g>

    <g class="rise" style="animation-delay:1.10s">
      <text class="ink serif" x="620" y="112" font-size="30">841</text>
      <text class="dim" x="700" y="112" font-size="13">commits</text>
      <line x1="620" y1="126" x2="840" y2="126" stroke="#2B2926" />
    </g>
    <g class="rise" style="animation-delay:1.20s">
      <text class="ink serif" x="620" y="160" font-size="30">0</text>
      <text class="dim" x="700" y="160" font-size="13">pull requests</text>
      <line x1="620" y1="174" x2="840" y2="174" stroke="#2B2926" />
    </g>
    <g class="rise" style="animation-delay:1.30s">
      <text class="ink serif" x="620" y="208" font-size="30">0</text>
      <text class="dim" x="700" y="208" font-size="13">reviews</text>
      <line x1="620" y1="222" x2="840" y2="222" stroke="#2B2926" />
    </g>
    <g class="rise" style="animation-delay:1.40s">
      <text class="ink serif" x="620" y="256" font-size="30">1</text>
      <text class="dim" x="700" y="256" font-size="13">issues</text>
      <line x1="620" y1="270" x2="840" y2="270" stroke="#2B2926" />
    </g>
</svg>
